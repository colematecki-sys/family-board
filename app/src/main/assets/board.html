<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Family Board</title>
<!-- Runs in Android 4.4's 2013 browser engine: plain ES5 and old CSS only (no grid, no let/const, no arrows). -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4efe6; color: #2b2a28;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0); }
  /* #wrap is nudged a few pixels every few minutes so nothing sits on the same pixels all day. */
  #wrap { position: absolute; left: 8px; top: 8px; right: 8px; bottom: 8px; }
  #head { position: absolute; left: 0; right: 0; top: 0; height: 44px; line-height: 44px; }
  #clock { float: left; font-size: 30px; font-weight: bold; padding: 0 10px 0 4px; }
  #date { float: left; font-size: 18px; color: #6b665e; }
  #tabs { float: left; margin-left: 14px; }
  #tabs span { display: inline-block; height: 32px; line-height: 32px; padding: 0 14px; margin-right: 6px; border-radius: 16px;
    background: #e6dfd2; color: #6b665e; font-size: 15px; vertical-align: middle; }
  #tabs span.on { background: #2b2a28; color: #fff; }
  /* Views: Home shows both; Week gives the days the full height; Tasks gives the people the full height. */
  .v-week .col, .v-tasks .day { display: none; }
  .v-week .day { height: auto; bottom: 0; }
  .v-week .ev { font-size: 16px; line-height: 20px; padding: 6px 8px 7px; }
  .v-week .ev b { font-size: 13px; }
  .v-tasks .col { top: 50px; }
  .focus .task { font-size: 26px; line-height: 30px; min-height: 44px; padding-top: 14px; padding-bottom: 14px; }
  .focus .colhead { font-size: 22px; }
  /* One day, large enough to read from across the room. Tap anywhere to close. */
  #dayview { display: none; position: absolute; left: 0; top: 50px; right: 0; bottom: 0; background: #fff; border-radius: 10px;
    overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 4; }
  #dayview h2 { margin: 0; padding: 10px 16px; background: #2b2a28; color: #fff; font-size: 24px; }
  #dayview h2 span { float: right; font-weight: normal; font-size: 15px; opacity: 0.8; }
  #dayview .ev { font-size: 24px; line-height: 30px; padding: 10px 16px; border-left-width: 8px; }
  #dayview .ev b { font-size: 16px; }
  .cal { display: inline-block; padding: 8px 12px; margin: 3px 6px 3px 0; border-radius: 6px; background: #eee8dc; border-left: 8px solid #999; }
  .cal.off { opacity: 0.45; text-decoration: line-through; }
  #weather { float: right; font-size: 15px; color: #2b2a28; padding-right: 10px; }
  /* Info line under the header: dinner, countdowns, family note. Everything below moves down when it shows. */
  #info { display: none; position: absolute; left: 0; right: 0; top: 46px; height: 26px; line-height: 26px; padding: 0 10px;
    background: #2b2a28; color: #fff; border-radius: 8px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hasinfo #info { display: block; }
  .hasinfo .day, .hasinfo .v-tasks .col, .hasinfo #dayview { top: 78px; }
  .hasinfo .col { top: 290px; }
  .task.overdue { color: #b5483f; }
  .alldone { padding: 8px 12px; font-size: 15px; font-weight: bold; text-align: center; }
  .add { padding: 12px; color: #9a948a; font-size: 15px; }
  .addbox { padding: 8px; }
  .addbox input { width: 100%; box-sizing: border-box; font-size: 17px; padding: 8px; border: 2px solid #b9b2a5; border-radius: 6px; }
  .addbox span { display: inline-block; padding: 8px 14px; margin: 6px 6px 0 0; border-radius: 6px; background: #eee8dc; font-size: 15px; }
  .addbox .ok { background: #2b2a28; color: #fff; }
  #sync { float: right; font-size: 13px; color: #9a948a; padding-right: 6px; }
  .col { position: absolute; top: 262px; bottom: 0; background: #fff; border-radius: 10px; overflow: hidden; }
  .colhead { height: 34px; line-height: 34px; padding: 0 12px; color: #fff; font-size: 18px; font-weight: bold; }
  .colhead span { float: right; font-weight: normal; font-size: 14px; opacity: 0.9; }
  .list { position: absolute; top: 34px; bottom: 0; left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .task { position: relative; min-height: 36px; padding: 10px 8px 10px 48px; border-bottom: 1px solid #eee8dc;
    font-size: 17px; line-height: 20px; }
  .task .box { position: absolute; left: 10px; top: 50%; margin-top: -15px; width: 26px; height: 26px;
    border: 2px solid #b9b2a5; border-radius: 15px; text-align: center; line-height: 26px; font-size: 18px; color: #fff; }
  .task.done { color: #aaa398; text-decoration: line-through; padding-right: 46px; }
  /* Delete control on finished tasks: a cross, then an inline Yes/No so one stray tap can't delete. */
  .del { position: absolute; right: 0; top: 0; bottom: 0; width: 44px; text-align: center; font-size: 20px; color: #b9b2a5;
    text-decoration: none; line-height: 40px; }
  /* inline-block stops the row's strike-through running through the question */
  .ask { display: inline-block; width: 100%; white-space: nowrap; color: #2b2a28; font-size: 15px; padding-top: 6px; }
  .task.asking { padding-right: 6px; }
  .ask span { display: inline-block; padding: 8px 12px; margin-left: 6px; border-radius: 6px; background: #eee8dc; }
  .ask .yes { background: #b5483f; color: #fff; }
  .empty { padding: 16px 12px; color: #aaa398; font-size: 15px; }
  /* Week strip: one column per day, today first. */
  .day { position: absolute; top: 50px; height: 204px; background: #fff; border-radius: 10px; overflow: hidden; }
  .dayhead { height: 26px; line-height: 26px; padding: 0 8px; background: #5b5f97; color: #fff; font-size: 14px; font-weight: bold; }
  .day.today .dayhead { background: #2b2a28; }
  .daylist { position: absolute; top: 26px; bottom: 0; left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ev { padding: 4px 8px 5px; font-size: 13px; line-height: 16px; border-bottom: 1px solid #eee8dc; word-wrap: break-word;
    border-left: 4px solid transparent; }
  .ev b { display: block; font-size: 11px; color: #6b665e; font-weight: normal; }
  .noev { padding: 8px; color: #c2bcb0; font-size: 12px; }
  #setup { display: none; position: absolute; left: 10%; right: 10%; top: 8%; bottom: 8%; background: #fff;
    border: 2px solid #2b2a28; border-radius: 12px; padding: 14px 18px; overflow-y: auto; font-size: 15px; z-index: 5; }
  /* Month tab */
  .v-month .col, .v-month .day { display: none; }
  #month { position: absolute; left: 0; right: 0; top: 50px; bottom: 0; background: #fff; border-radius: 10px; overflow: hidden; }
  .hasinfo #month { top: 78px; }
  .mhead { position: absolute; top: 0; height: 24px; line-height: 24px; text-align: center; font-size: 12px; font-weight: bold;
    background: #5b5f97; color: #fff; }
  #mgrid { position: absolute; left: 0; right: 0; top: 24px; bottom: 0; }
  .mcell { position: absolute; overflow: hidden; border-right: 1px solid #eee8dc; border-bottom: 1px solid #eee8dc; box-sizing: border-box; }
  .mcell b { display: block; padding: 2px 6px 0; font-size: 14px; }
  .mcell.today b { background: #2b2a28; color: #fff; }
  .mev { margin: 1px 3px 0; padding-left: 4px; border-left: 3px solid #999; font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; }
  .mmore { padding: 0 6px; font-size: 10px; color: #8a8478; }
  /* Photo slideshow on the idle screen */
  #photo { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; margin: auto; max-width: 100%; max-height: 100%; }
  .photos #photo { display: block; }
  .photos #nightClock { font-size: 22px; color: #ddd; left: 12px !important; top: auto !important; bottom: 8px; text-shadow: 0 0 4px #000; }
  #night { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; z-index: 9; }
  #nightClock { position: absolute; color: #555; font-size: 64px; font-weight: bold; }
  #setup h2 { margin: 0 0 8px; font-size: 20px; }
  #setup button { font-size: 16px; padding: 10px 14px; margin: 4px 6px 4px 0; }
  #setup pre { background: #f4efe6; padding: 8px; white-space: pre-wrap; word-wrap: break-word; font-size: 13px; margin: 6px 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="head"><div id="clock"></div><div id="date"></div>
    <div id="tabs"></div>
    <div id="sync"></div><div id="weather"></div></div>
  <div id="info"></div>
  <div id="cols"></div>
  <div id="dayview"></div>
  <div id="setup">
    <h2>Setup &amp; diagnostics</h2>
    <div>
      <button id="btnTest">Test connection to Google</button>
      <button id="btnDim">Dim now (test)</button>
      <button id="btnPhotos"></button>
      <button id="btnSettings">Open Android settings</button>
      <button id="btnClose">Close</button>
    </div>
    <pre id="netOut">Connection: not tested yet</pre>
    <div>Dim after
      <button id="dimMinus">-</button><b id="dimVal"></b> s<button id="dimPlus">+</button>
      &nbsp; Motion sensitivity (lower = more sensitive)
      <button id="thrMinus">-</button><b id="thrVal"></b><button id="thrPlus">+</button>
    </div>
    <div>Quiet hours - stays dark and ignores movement; a touch still wakes it.</div>
    <div>From
      <button id="qsMinus">-</button><b id="qsVal"></b><button id="qsPlus">+</button> to
      <button id="qeMinus">-</button><b id="qeVal"></b><button id="qePlus">+</button>
    </div>
    <div>Calendars shown (tap to hide or show):</div>
    <div id="cals"></div>
    <pre id="camOut">Camera: ...</pre>
  </div>
</div>
<div id="night"><img id="photo"><div id="nightClock"></div></div>
<script>
var COLORS = ['#3f7fbf', '#b5586b', '#4d9a6a', '#c98a2b'];
var CAL_COLOR = '#5b5f97';

// Sample data, shown only until the first successful sync with the family's Google Sheet and Calendar.
var data = {
  people: ['Dad', 'Mom', 'Kid 1', 'Kid 2'],
  tasks: [
    { id: 't1', person: 'Dad', title: 'Take out trash' },
    { id: 't2', person: 'Dad', title: 'Pay water bill' },
    { id: 't3', person: 'Mom', title: 'Sign permission slip' },
    { id: 't4', person: 'Mom', title: 'Order groceries' },
    { id: 't5', person: 'Kid 1', title: 'Make bed' },
    { id: 't6', person: 'Kid 1', title: 'Feed the dog' },
    { id: 't7', person: 'Kid 1', title: 'Homework' },
    { id: 't8', person: 'Kid 2', title: 'Make bed' },
    { id: 't9', person: 'Kid 2', title: 'Put toys away' }
  ],
  days: [
    { label: 'Today', events: [{ time: '5:30 PM', title: 'Basketball practice', cal: 'Kids', color: '#4d9a6a' }, { time: '7:00 PM', title: 'Family dinner', cal: 'Family', color: '#c98a2b' }] },
    { label: 'Mon 16', events: [{ time: '8:15 AM', title: 'Dentist', cal: 'Family', color: '#c98a2b' }, { time: '9:00 AM', title: 'Work', cal: 'Work', color: '#3f7fbf' }] },
    { label: 'Tue 17', events: [] },
    { label: 'Wed 18', events: [{ time: 'All day', title: 'Library books due' }] },
    { label: 'Thu 19', events: [] },
    { label: 'Fri 20', events: [{ time: '6:00 PM', title: 'Movie night' }] },
    { label: 'Sat 21', events: [{ time: '9:00 AM', title: 'Game' }] }
  ],
  calendars: [{ name: 'Family', color: '#c98a2b' }, { name: 'Kids', color: '#4d9a6a' }, { name: 'Work', color: '#3f7fbf' }],
  shared: [], lists: {}, note: '', dinner: 'Tacos', countdowns: [{ title: "Grandma's birthday", days: 3 }],
  weather: { now: 54, hi: 61, lo: 45, text: 'Cloudy' }
};

var hasTablet = typeof Tablet !== 'undefined';
function $(id) { return document.getElementById(id); }
function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}
// Settings kept on the tablet. Quiet hours default to 10 PM - 6 AM; hide = calendar names not shown.
var cfg = store('cfg') || {};
if (cfg.dim === undefined) cfg.dim = 120;
if (cfg.thr === undefined) cfg.thr = 8;
if (cfg.qs === undefined) { cfg.qs = 22; cfg.qe = 6; }
if (!cfg.hide) cfg.hide = [];
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// ---- Sync with the Google web app (through the app, because this old browser can't make the request itself) ----
function refresh() {
  if (!hasTablet) return;
  var u = Tablet.dataUrl();
  if (!u) { $('sync').innerHTML = 'sample data (not linked yet)'; return; }
  Tablet.fetch('data', u);
}
var lastSync = 'no sync attempted yet', pending = 0;
function handleData(status, body) {
  var d = null;
  // Kept for the setup panel, so a failed sync can be diagnosed on the tablet.
  lastSync = (status ? 'HTTP ' + status : 'connection failed') + ': ' + String(body).substring(0, 300);
  try { d = JSON.parse(body); } catch (e) { }
  if (pending > 0) return;
  if (status === 200 && d && d.people && d.tasks && d.days) {
    data = d; store('data', d); render();
    $('sync').innerHTML = 'Updated ' + $('clock').innerHTML;
  } else {
    // Keep showing the last good copy rather than blanking the board.
    $('sync').innerHTML = 'Offline - showing last copy' + (d && d.error ? ' (' + esc(d.error) + ')' : '');
  }
}
var armed = null; // id of the finished task currently showing "Delete? Yes / No"
var view = 'home', focus = null, detail = null; // which tab, which single person (if any), which day is enlarged
var month = store('month'), monthAt = 0;       // the Month tab's data and when it was fetched
function hiddenCal(ev) { return ev.cal && cfg.hide.indexOf(ev.cal) >= 0; }
function evHtml(ev) {
  return '<div class="ev"' + (ev.color ? ' style="border-left-color:' + esc(ev.color) + '"' : '') + '><b>' + esc(ev.time) + '</b>' + esc(ev.title) + '</div>';
}
var adding = null, addText = ''; // person whose "add a task" box is open, and what has been typed so far
var shown = [];                  // the people currently drawn as columns, in order
// Stars: one per task ticked, counted per person on this tablet, starting again each Sunday.
var stars = store('stars') || {};
function starWeek() { var d = new Date(); d.setDate(d.getDate() - d.getDay()); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function star(person, by) {
  if (stars.week !== starWeek()) stars = { week: starWeek(), n: {} };
  stars.n[person] = Math.max(0, (stars.n[person] || 0) + by);
  store('stars', stars);
}
function render() {
  var html = '', i, j, shared = data.shared || [];
  if ($('newTask')) addText = $('newTask').value; // keep what is being typed when a refresh redraws the board
  if (focus !== null && data.people.indexOf(focus) < 0) focus = null;
  shown = [];
  for (i = 0; i < data.people.length; i++) {
    if (focus !== null ? data.people[i] === focus : shared.indexOf(data.people[i]) < 0) shown.push(data.people[i]);
  }
  var n = shown.length, w = n ? 100 / n : 0, weekStars = stars.week === starWeek() ? stars.n : {};
  for (i = 0; i < n; i++) {
    var who = shown[i], ci = data.people.indexOf(who) % 4, isShared = shared.indexOf(who) >= 0;
    var mine = [], finished = 0, rows = '';
    for (j = 0; j < data.tasks.length; j++) if (data.tasks[j].person === who) mine.push(data.tasks[j]);
    // Unfinished first, finished at the bottom.
    mine.sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0); });
    for (j = 0; j < mine.length; j++) {
      var d = !!mine[j].done;
      if (d) finished++;
      rows += '<div class="task' + (d ? ' done' : '') + (!d && mine[j].overdue ? ' overdue' : '') + (armed === mine[j].id ? ' asking' : '') +
        '" data-id="' + esc(mine[j].id) + '">' +
        '<div class="box"' + (d ? ' style="background:' + COLORS[ci] + ';border-color:' + COLORS[ci] + '"' : '') + '>' +
        (d ? '&#10003;' : '') + '</div>' + esc(mine[j].title) +
        (!d ? '' : armed === mine[j].id
          ? '<span class="ask">Delete?<span class="yes" data-yes="1">Yes</span><span data-no="1">No</span></span>'
          : '<span class="del" data-del="1">&#10005;</span>') + '</div>';
    }
    if (!mine.length) rows = '<div class="empty">Nothing to do</div>';
    else if (finished === mine.length && !isShared) rows = '<div class="alldone" style="color:' + COLORS[ci] + '">&#9733; All done! &#9733;</div>' + rows;
    rows += adding === who
      ? '<div class="addbox"><input id="newTask" maxlength="200" value="' + esc(addText) + '">' +
        '<span class="ok" data-addok="1">Add</span><span data-addno="1">Cancel</span></div>'
      : '<div class="add" data-add="' + i + '">+ Add</div>';
    html += '<div class="col' + (focus !== null ? ' focus' : '') + '" style="left:' + (i * w) + '%;width:' + (w - (i < n - 1 ? 1 : 0)) + '%">' +
      '<div class="colhead" data-person="' + i + '" style="background:' + COLORS[ci] + '">' + esc(who) +
      '<span>' + (isShared ? '' : '&#9733; ' + (weekStars[who] || 0) + ' &nbsp; ') + finished + '/' + mine.length + '</span></div>' +
      '<div class="list">' + rows + '</div></div>';
  }
  if (!n) html += '<div class="col" style="left:0;width:100%"><div class="empty">No task lists yet. Add a list in Google Tasks for each person.</div></div>';
  var nd = data.days.length, dw = nd ? 100 / nd : 0;
  for (i = 0; i < nd; i++) {
    var ev = '', evs = data.days[i].events;
    for (j = 0; j < evs.length; j++) if (!hiddenCal(evs[j])) ev += evHtml(evs[j]);
    html += '<div class="day' + (i === 0 ? ' today' : '') + '" data-day="' + i + '" style="left:' + (i * dw) + '%;width:' + (dw - (i < nd - 1 ? 0.7 : 0)) + '%">' +
      '<div class="dayhead">' + esc(data.days[i].label) + '</div><div class="daylist">' + (ev || '<div class="noev">-</div>') + '</div></div>';
  }
  if (view === 'month' && focus === null) {
    var mh = '', WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    for (i = 0; i < 7; i++) mh += '<div class="mhead" style="left:' + (i * 100 / 7) + '%;width:' + (100 / 7) + '%">' + WD[i] + '</div>';
    if (!month) mh += '<div id="mgrid"><div class="empty">Loading the month...</div></div>';
    else {
      var rowsN = Math.ceil((month.offset + month.days.length) / 7), fit = rowsN > 5 ? 3 : 4;
      mh += '<div id="mgrid">';
      for (i = 0; i < month.days.length; i++) {
        var at = month.offset + i, list = [], cell = '';
        for (j = 0; j < month.days[i].length; j++) if (!hiddenCal(month.days[i][j])) list.push(month.days[i][j]);
        for (j = 0; j < list.length && j < fit; j++) {
          cell += '<div class="mev"' + (list[j].color ? ' style="border-left-color:' + esc(list[j].color) + '"' : '') + '>' + esc(list[j].title) + '</div>';
        }
        if (list.length > fit) cell += '<div class="mmore">+' + (list.length - fit) + ' more</div>';
        mh += '<div class="mcell' + (i + 1 === month.today ? ' today' : '') + '" data-mday="' + (i + 1) + '" style="left:' + ((at % 7) * 100 / 7) +
          '%;width:' + (100 / 7) + '%;top:' + (Math.floor(at / 7) * 100 / rowsN) + '%;height:' + (100 / rowsN) + '%"><b>' + (i + 1) + '</b>' + cell + '</div>';
      }
      mh += '</div>';
    }
    html += '<div id="month">' + mh + '</div>';
  }
  $('cols').innerHTML = html;
  $('cols').className = 'v-' + (focus !== null ? 'tasks' : view);
  if ($('newTask')) $('newTask').focus();
  // Tabs: the three views, then one per shared list such as Groceries.
  var names = { home: 'Home', week: 'Week', month: 'Month', tasks: 'Tasks' }, th = '';
  for (var v in names) th += '<span data-view="' + v + '"' + (v === view && focus === null ? ' class="on"' : '') + '>' + names[v] + '</span>';
  for (i = 0; i < shared.length; i++) th += '<span data-shared="' + i + '"' + (focus === shared[i] ? ' class="on"' : '') + '>' + esc(shared[i]) + '</span>';
  $('tabs').innerHTML = th;
  // Info line and weather
  var bits = [], cd = data.countdowns || [];
  if (data.dinner) bits.push('Dinner: ' + data.dinner);
  for (i = 0; i < cd.length; i++) bits.push(cd[i].title + (cd[i].days === 1 ? ' tomorrow' : ' in ' + cd[i].days + ' days'));
  if (data.note) bits.push(data.note);
  $('info').innerHTML = esc(bits.join('   \u00b7   '));
  $('wrap').className = bits.length ? 'hasinfo' : '';
  var wx = data.weather;
  $('weather').innerHTML = wx ? esc(wx.now + '\u00b0 ' + wx.text + '  \u2191' + wx.hi + '\u00b0 \u2193' + wx.lo + '\u00b0') : '';
  // Enlarged single day
  var dv = $('dayview');
  if (detail) {
    var big = '', de = detail.events;
    for (j = 0; j < de.length; j++) if (!hiddenCal(de[j])) big += evHtml(de[j]);
    dv.innerHTML = '<h2>' + esc(detail.label) + '<span>tap to close</span></h2>' + (big || '<div class="empty">Nothing scheduled</div>');
    dv.style.display = 'block';
  } else dv.style.display = 'none';
}
// Navigation: tabs, tap a day to enlarge it, tap a name to show only that person. Returns to Home when left alone.
var homeTimer = null;
function goHome() { view = 'home'; focus = null; detail = null; armed = null; adding = null; addText = ''; render(); }
function touched() { clearTimeout(homeTimer); homeTimer = setTimeout(goHome, 60000); }
document.addEventListener('click', touched, true);
document.addEventListener('input', touched, true); // typing a new task counts as activity
$('tabs').addEventListener('click', function (e) {
  var v = e.target.getAttribute('data-view'), sh = e.target.getAttribute('data-shared');
  if (v) { view = v; focus = null; detail = null; adding = null; render(); if (v === 'month') loadMonth(); }
  if (sh !== null) { focus = (data.shared || [])[+sh]; detail = null; adding = null; render(); }
});
$('dayview').addEventListener('click', function () { detail = null; render(); });
// The month is fetched when its tab opens, and again if the copy is more than ten minutes old.
function loadMonth() {
  var u = hasTablet ? Tablet.dataUrl() : '';
  if (u && new Date().getTime() - monthAt > 600000) Tablet.fetch('month', u + '&action=month');
}

// Adds what was typed to the open person's list: shown at once, then saved to Google Tasks.
function addTask() {
  var title = $('newTask') ? $('newTask').value.replace(/^\s+|\s+$/g, '') : '', who = adding;
  adding = null; addText = '';
  if (title && who !== null) {
    data.tasks.push({ id: 'new' + new Date().getTime(), person: who, title: title, done: false });
    var u = hasTablet ? Tablet.dataUrl() : '', list = (data.lists || {})[who];
    if (u && list) {
      pending++;
      Tablet.fetch('act', u + '&action=add&list=' + encodeURIComponent(list) + '&title=' + encodeURIComponent(title));
    }
  }
  render();
}
$('cols').addEventListener('keydown', function (e) { if (e.keyCode === 13 && e.target.id === 'newTask') addTask(); });
function send(t, action) {
  // Tell Google Tasks; until it answers, incoming refreshes are ignored so the change doesn't flicker back.
  var u = hasTablet ? Tablet.dataUrl() : '';
  if (!u || !t.list) return;
  pending++;
  Tablet.fetch('act', u + '&action=' + action + '&list=' + encodeURIComponent(t.list) + '&task=' + encodeURIComponent(t.id));
}
$('cols').addEventListener('click', function (e) {
  var el = e.target, hit = e.target, up = e.target;
  // A tap on a name focuses that person (tap again to go back); a tap on a day enlarges it.
  while (up && up !== this) {
    if (up.getAttribute('data-person')) {
      var who = shown[+up.getAttribute('data-person')];
      focus = focus === who ? null : who; adding = null; render(); return;
    }
    if (up.getAttribute('data-add')) { adding = shown[+up.getAttribute('data-add')]; addText = ''; render(); return; }
    if (up.getAttribute('data-addno')) { adding = null; addText = ''; render(); return; }
    if (up.getAttribute('data-addok')) { addTask(); return; }
    if (up.id === 'newTask') return;
    if (up.getAttribute('data-day')) { detail = data.days[+up.getAttribute('data-day')]; render(); return; }
    if (up.getAttribute('data-mday')) {
      var md = +up.getAttribute('data-mday');
      detail = { label: month.title.split(' ')[0] + ' ' + md, events: month.days[md - 1] }; render(); return;
    }
    up = up.parentNode;
  }
  while (el && el !== this && !(el.className && /\btask\b/.test(el.className))) el = el.parentNode;
  if (!el || el === this) return;
  var id = el.getAttribute('data-id'), t = null;
  for (var k = 0; k < data.tasks.length; k++) if (data.tasks[k].id === id) t = data.tasks[k];
  if (!t) return;
  if (hit.getAttribute('data-del')) { armed = id; render(); return; }
  if (hit.getAttribute('data-no')) { armed = null; render(); return; }
  if (hit.getAttribute('data-yes')) {
    armed = null;
    data.tasks.splice(data.tasks.indexOf(t), 1);
    render();
    send(t, 'delete');
    return;
  }
  if (armed === id) return; // while the question is showing, only Yes or No do anything
  armed = null;
  t.done = !t.done;
  if ((data.shared || []).indexOf(t.person) < 0) star(t.person, t.done ? 1 : -1);
  render();
  send(t, t.done ? 'done' : 'undo');
});

var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function tickClock() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  $('clock').innerHTML = ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM');
  $('nightClock').innerHTML = $('clock').innerHTML;
  // The dim clock sits somewhere different every minute.
  $('nightClock').style.left = (5 + (m * 7) % 50) + '%'; $('nightClock').style.top = (10 + (m * 13) % 60) + '%';
  $('date').innerHTML = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
}

// Pixel shift: move the whole board through a small loop of offsets.
var SHIFTS = [[0, 0], [3, 2], [6, 4], [3, 6], [0, 4], [-3, 2]], shiftAt = 0;
function shift() {
  shiftAt = (shiftAt + 1) % SHIFTS.length;
  var s = SHIFTS[shiftAt], w = $('wrap').style;
  w.left = (8 + s[0]) + 'px'; w.right = (8 - s[0]) + 'px';
  w.top = (8 + s[1]) + 'px'; w.bottom = (8 - s[1]) + 'px';
}

// Called by the app when it dims or wakes the screen. The black layer also swallows the wake-up tap.
var isDim = false, photoTimer = null, photoAt = -1;
function quietNow() {
  var h = new Date().getHours(), a = cfg.qs, b = cfg.qe;
  return a === b ? false : a < b ? (h >= a && h < b) : (h >= a || h < b);
}
// Idle screen: family photos from the tablet's FamilyBoard folder, or the black clock (always the clock in quiet hours).
function nextPhoto() {
  var n = cfg.photos && !quietNow() && hasTablet && Tablet.photoCount ? Tablet.photoCount() : 0, pic = '';
  if (n) { photoAt = (photoAt + 1) % n; pic = Tablet.photo(photoAt); }
  if (pic) $('photo').src = 'data:image/jpeg;base64,' + pic;
  $('night').className = pic ? 'photos' : '';
}
function onDim(d) {
  isDim = d;
  $('night').style.display = d ? 'block' : 'none';
  clearInterval(photoTimer);
  if (d) { goHome(); nextPhoto(); photoTimer = setInterval(nextPhoto, 30000); }
  else { $('night').className = ''; refresh(); }
}

// ---- Setup panel: tap the clock five times quickly ----
function hourName(h) { return ' ' + ((h % 12) || 12) + (h < 12 ? ' AM ' : ' PM '); }
function showCals() {
  var html = '', list = data.calendars || [];
  for (var i = 0; i < list.length; i++) {
    html += '<span class="cal' + (cfg.hide.indexOf(list[i].name) >= 0 ? ' off' : '') + '" data-cal="' + i +
      '" style="border-left-color:' + esc(list[i].color || '#999') + '">' + esc(list[i].name) + '</span>';
  }
  $('cals').innerHTML = html || '(none yet - they appear after the first sync)';
}
var taps = 0, tapTimer = null, statusTimer = null;
function applyCfg() {
  store('cfg', cfg);
  $('dimVal').innerHTML = ' ' + cfg.dim; $('thrVal').innerHTML = ' ' + cfg.thr + ' ';
  $('qsVal').innerHTML = hourName(cfg.qs); $('qeVal').innerHTML = hourName(cfg.qe) + (cfg.qs === cfg.qe ? '(off) ' : '');
  showCals();
  $('btnPhotos').innerHTML = 'Idle screen: ' + (cfg.photos ? 'photos' : 'black clock') +
    (hasTablet && Tablet.photoCount ? ' (' + Tablet.photoCount() + ' photos on tablet)' : '');
  if (hasTablet) Tablet.configure(cfg.dim, cfg.thr, cfg.qs, cfg.qe);
}
function showStatus() {
  if (!hasTablet) { $('camOut').innerHTML = 'Camera: (not running inside the tablet app)'; return; }
  var s = JSON.parse(Tablet.status());
  $('camOut').innerHTML = 'Linked to: ' + esc((Tablet.dataUrl() || '(not linked)').split('?')[0]) +
    '\nLast sync: ' + esc(lastSync) + '\n\nCamera: ' + esc(s.camera) + '\nDimmed: ' + (s.dimmed ? 'yes' : 'no') + '   Quiet hours now: ' + (s.quiet ? 'yes' : 'no') + '\nMovement level now: ' + s.diff +
    '   (wakes at ' + cfg.thr + ' or more)\nMovements detected: ' + s.motions + '\nSeconds since last activity: ' + s.idleSeconds;
}
$('clock').addEventListener('click', function () {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(function () { taps = 0; }, 1500);
  if (taps >= 5) { taps = 0; $('setup').style.display = 'block'; showStatus(); statusTimer = setInterval(showStatus, 1000); }
});
$('btnClose').addEventListener('click', function () { $('setup').style.display = 'none'; clearInterval(statusTimer); });
$('btnDim').addEventListener('click', function () { if (hasTablet) Tablet.dimNow(); });
$('btnPhotos').addEventListener('click', function () { cfg.photos = !cfg.photos; applyCfg(); });
$('btnSettings').addEventListener('click', function () { if (hasTablet) Tablet.openSettings(); });
$('dimMinus').addEventListener('click', function () { cfg.dim = Math.max(15, cfg.dim - 15); applyCfg(); });
$('dimPlus').addEventListener('click', function () { cfg.dim += 15; applyCfg(); });
$('thrMinus').addEventListener('click', function () { cfg.thr = Math.max(1, cfg.thr - 1); applyCfg(); });
$('thrPlus').addEventListener('click', function () { cfg.thr += 1; applyCfg(); });
$('qsMinus').addEventListener('click', function () { cfg.qs = (cfg.qs + 23) % 24; applyCfg(); });
$('qsPlus').addEventListener('click', function () { cfg.qs = (cfg.qs + 1) % 24; applyCfg(); });
$('qeMinus').addEventListener('click', function () { cfg.qe = (cfg.qe + 23) % 24; applyCfg(); });
$('qePlus').addEventListener('click', function () { cfg.qe = (cfg.qe + 1) % 24; applyCfg(); });
$('cals').addEventListener('click', function (e) {
  var i = e.target.getAttribute('data-cal');
  if (i === null) return;
  var name = data.calendars[+i].name, at = cfg.hide.indexOf(name);
  if (at >= 0) cfg.hide.splice(at, 1); else cfg.hide.push(name);
  applyCfg(); render();
});

var TESTS = [
  ['google', 'https://www.google.com/generate_204'],
  ['script', 'https://script.google.com/'],
  ['calendar', 'https://calendar.google.com/robots.txt']
];
var netLines = {};
$('btnTest').addEventListener('click', function () {
  if (!hasTablet) { $('netOut').innerHTML = 'Connection: (not running inside the tablet app)'; return; }
  netLines = {};
  for (var i = 0; i < TESTS.length; i++) { netLines[TESTS[i][0]] = 'waiting...'; Tablet.fetch(TESTS[i][0], TESTS[i][1]); }
  showNet();
});
function showNet() {
  var out = '';
  for (var i = 0; i < TESTS.length; i++) out += TESTS[i][1] + '\n  -> ' + netLines[TESTS[i][0]] + '\n';
  $('netOut').innerHTML = esc(out);
}
// Called by the app when a Tablet.fetch finishes. Status 0 means the connection itself failed.
function onFetch(id, status, body) {
  if (id === 'data') { handleData(status, body); return; }
  if (id === 'month') {
    var mo = null;
    try { mo = JSON.parse(body); } catch (e) { }
    if (status === 200 && mo && mo.days && mo.title) { month = mo; monthAt = new Date().getTime(); store('month', mo); render(); }
    return;
  }
  if (id === 'act') {
    pending = Math.max(0, pending - 1);
    if (status !== 200 || body.indexOf('"ok"') < 0) lastSync = 'check-off not saved: ' + String(body).substring(0, 200);
    if (!pending) refresh(); // re-read the truth; a tick that failed to save comes back unticked
    return;
  }
  netLines[id] = status ? 'OK (HTTP ' + status + ')' : 'FAILED: ' + String(body).substring(0, 200);
  showNet();
}

if (store('data') && store('data').days) data = store('data');
render();
tickClock();
applyCfg();
setInterval(tickClock, 5000);
setInterval(shift, 4 * 60 * 1000);
$('sync').innerHTML = 'sample data';
refresh();
// Every minute while the screen is awake; a dimmed board skips it and catches up the moment it wakes.
setInterval(function () { if (!isDim) refresh(); }, 60 * 1000);
</script>
