plugins { id 'com.android.application' }

android {
    namespace 'com.familyboard.kiosk'
    compileSdk 34
    defaultConfig {
        applicationId 'com.familyboard.kiosk'
        minSdk 19   // the tablet runs Android 4.4.2
        targetSdk 19
        versionCode 9
        versionName '0.9'
    }
    signingConfigs {
        // Fixed key committed to the repo so every build can update the previous install.
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false }
}
